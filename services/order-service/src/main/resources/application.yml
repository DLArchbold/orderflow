server:
  port: 8080
spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/orders
    username: orderflow
    password: orderflow
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway creates the tables; Hibernate only checks they match your entities
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html    # open http://localhost:8080/swagger-ui.html
