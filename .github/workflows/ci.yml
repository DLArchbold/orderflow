# Display name shown in the GitHub Actions tab and in `gh run list`
name: ci

# Triggers: run on every push to any branch, and on every pull request opened/updated
on: [push, pull_request]

# Jobs run in parallel by default, each on its own fresh machine
jobs:
  # Builds and tests both Spring Boot services (one matrix entry per service, run in parallel)
  backend:
    # GitHub-hosted Linux virtual machine, wiped after the job. ubuntu-latest has Docker, so the
    # Testcontainers tests (PostgreSQL, Kafka, Redis) run unchanged; the first run pulls the images and is slow.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, inventory-service]
    steps:
      # Clone the repository onto the runner (without this the machine has no code)
      - uses: actions/checkout@v7
      # Install a JDK on the runner
      - uses: actions/setup-java@v4
        # temurin = Eclipse Temurin JDK build; version 21 matches the project;
        # cache: maven saves downloaded dependencies between runs to speed up later builds
        with: { distribution: temurin, java-version: '21', cache: maven }
      # Compile, run the tests and build the jar; -B (batch mode) removes colors/progress bars from logs.
      # A compile error or failing test makes this step, and the job, fail.
      - run: mvn -B verify
        # Run the command in the folder that contains pom.xml
        working-directory: services/${{ matrix.service }}

  # Tests and builds the React/TypeScript frontend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # Jobs don't share files, so this job clones the repository again
      - uses: actions/checkout@v7
      # Install Node.js
      - uses: actions/setup-node@v4
        # Node 22 matches the local version; cache: npm saves the downloaded packages between runs
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci installs exactly what package-lock.json says (and fails if it disagrees with package.json)
      - run: npm ci
      # Vitest + React Testing Library (step 20b)
      - run: npm test
      # Type-checks and bundles with Vite; type errors fail the job
      - run: npm run build

  # Builds the three images and pushes them to GitHub Container Registry, only on a push to main and only when the
  # tests above passed. The tag is the commit SHA (not just latest) so a deploy or rollback names one exact build.
  images:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # GITHUB_TOKEN may write packages only if the workflow says so
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: order-service, context: services/order-service }
          - { name: inventory-service, context: services/inventory-service }
          - { name: frontend, context: frontend }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Computes the image name and tags: ghcr.io/<owner>/orderflow-<name>:<sha>
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/orderflow-${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # layer cache between runs, so the Maven dependency layer is not rebuilt every time
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs the whole system from source in Docker Compose and drives it over HTTP (step 15d) and, on main only,
  # through a real browser (step 20c). Browser tests are slow, so pull requests get the HTTP test only (docs/ci.md).
  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      # Builds the three images from the Dockerfiles and waits until every health check passes
      - run: docker compose -f phase2/infra/docker-compose.full.yml --profile apps up -d --wait --build
      # The e2e module only talks HTTP to the running stack (ORDER_URL etc. default to localhost)
      - run: mvn -B -f e2e/pom.xml verify
      - if: github.ref == 'refs/heads/main'
        uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - if: github.ref == 'refs/heads/main'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
        working-directory: frontend
      # What the next person needs to see why it failed
      - if: failure()
        run: docker compose -f phase2/infra/docker-compose.full.yml --profile apps logs --no-color > compose-logs.txt
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            compose-logs.txt
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
      - if: always()
        run: docker compose -f phase2/infra/docker-compose.full.yml --profile apps down -v

  # Both services must become Ready on a throwaway Kubernetes cluster (step 23). Goal: the manifests are valid and the
  # probes work, not a production setup.
  kind:
    needs: [backend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1
        with: { cluster_name: orderflow }
      # Build the two service images and put them into the cluster's nodes (the pods use imagePullPolicy: IfNotPresent)
      - run: |
          docker build -t orderflow-order-service:local services/order-service
          docker build -t orderflow-inventory-service:local services/inventory-service
          kind load docker-image orderflow-order-service:local orderflow-inventory-service:local --name orderflow
      - run: kubectl apply -k phase2/infra/k8s
      - run: kubectl wait --for=condition=Available deployment --all --timeout=180s
      # On failure, show why: pod events and the container logs
      - if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods
          kubectl logs --all-containers --tail=200 -l 'app in (order-service, inventory-service, kafka, postgres)'
