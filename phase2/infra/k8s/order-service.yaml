apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0"   # there is no Jaeger in this cluster
  ORDERFLOW_INVENTORY_BASE_URL: http://inventory-service:8081
  SPRING_DATA_REDIS_HOST: redis                  # no Redis here: the stock cache degrades gracefully (step 17c)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1   # NOT 2: two instances would both publish the same outbox rows (known limit of step 13)
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      containers:
        - name: order-service
          image: orderflow-order-service:local
          imagePullPolicy: IfNotPresent   # the image is loaded into kind with 'kind load docker-image', never pulled
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: order-service-config }
            - secretRef: { name: db-credentials }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          # Spring Boot takes 10 to 30 s to start; without this the liveness probe would kill it while it boots
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 36            # up to 3 minutes
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector: { app: order-service }
  ports: [{ port: 8080, targetPort: 8080 }]
