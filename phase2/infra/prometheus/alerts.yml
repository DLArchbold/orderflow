# Metric names are placeholders: create these metrics in PLAN step 14, then adjust the names here.
groups:
  - name: orderflow
    rules:
      - alert: OutboxLagHigh
        expr: orderflow_outbox_unpublished > 100
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "Outbox backlog above 100 events for 2 minutes" }
      - alert: DeadLetterQueueGrowing
        expr: increase(orderflow_dlt_messages_total[5m]) > 0
        labels: { severity: warning }
        annotations: { summary: "Messages are being dead-lettered" }
