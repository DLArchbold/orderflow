name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, inventory-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B verify
        working-directory: services/${{ matrix.service }}
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # Switch to `npm ci` + caching once package-lock.json is committed.
      - run: npm install
      - run: npm test
      - run: npm run build
  # TODO (PLAN step 15): docker build + push, Playwright e2e against docker compose.
  # TODO (PLAN step 16): create a kind cluster, `kubectl apply -k infra/k8s`, wait for readiness.
